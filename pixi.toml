[workspace]
name = "mojo-tokenizer"
version = "0.1.0"
description = "Explicit pure-Mojo BPE core for model-input token buffers"
authors = ["Atsentia"]
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["linux-64"]

[tasks.build]
cmd = "mojo precompile -I .. src -o mojo_tokenizer.mojoc"

[tasks.test]
depends-on = ["build"]
cmd = "mojo run -I . tests/test_tokenizer.mojo"

[tasks.example]
depends-on = ["build"]
cmd = "mojo run -I . examples/basic_usage.mojo"

[dependencies]
mojo = ">=1.0.0b2,<2"
